# Render blueprint for the Scribe backend (scribe-api).
# The frontend deploys separately on Vercel (client/vercel.json); it calls this
# API directly via VITE_API_BASE_URL, so no proxy service is needed here.
# Dashboard: New > Blueprint > pick this repo. Secrets marked sync:false are set
# once in the Render dashboard (never commit real values here).
services:
  - type: web
    name: scribe-api
    runtime: python
    rootDir: server/backend
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Durable data comes from the free Postgres defined below. NOTE: free
      # Render Postgres expires 30 days after creation — upgrade or export
      # before then if the data matters.
      - key: DATABASE_URL
        fromDatabase:
          name: scribe-db
          property: connectionString
      # All sensitive values are sync:false — set them once in the Render
      # dashboard, never in this file. See AGENTS.md for the full list.
      - key: RECALL_REGION
        value: us-east-1
      - key: RECALL_API_BASE_URL
        value: https://us-east-1.recall.ai/api/v1
      - key: RECALL_API_KEY
        sync: false
      - key: RECALL_WORKSPACE_VERIFICATION_SECRET
        sync: false
      # Public URL of this service; Recall webhooks target {this}/api/webhooks/recall.
      - key: PUBLIC_API_BASE_URL
        sync: false
      # Comma-separated allowed origins (Vercel frontend + local dev ports).
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: scribe-db
    plan: free
    databaseName: scribe
    user: scribe
