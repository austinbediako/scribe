[project]
name = "scribe-backend"
version = "0.1.0"
description = "Scribe backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.7.1",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "httpx>=0.27.0",
  # Required by Starlette's TestClient (fastapi.testclient); it deprecates plain httpx.
  "httpx2>=0.28.0",
  "python-multipart>=0.0.9",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "psycopg[binary]>=3.2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
